name: Mattermost
version: "0.1.3"
slug: mattermost
description: "Mattermost Team Edition for Home Assistant with LAN access for users and bots."
url: "https://github.com/WolframRavenwolf/home-assistant-addons"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 49170
panel_icon: mdi:message-text
panel_title: Mattermost
map:
  - addon_config:rw
  - media:rw
  - share:rw
ports:
  8065/tcp: 8065
  8465/tcp: 8465
ports_description:
  8065/tcp: "HTTP: Mattermost web app and REST API"
  8465/tcp: "HTTPS: Mattermost web app and REST API with self-signed TLS"
options:
  site_url: "http://homeassistant.local:8065"
  access_password: ""
  env_vars:
    - name: "MM_TEAMSETTINGS_SITENAME"
      value: "Ravenwolf Mattermost"
    - name: "MM_EMAILSETTINGS_ENABLEPREVIEWMODEBANNER"
      value: "false"
schema:
  site_url: "url?"
  access_password: "password?"
  env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]{0,254}$)"
      value: "str"
